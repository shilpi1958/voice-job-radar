# Keep the gh-pages branch in sync with index.html on every push to main.
# Pages source should be: Deploy from a branch → gh-pages → / (root).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R vendor _site/vendor
          # local-server.js is a local-only OpenAI CORS proxy — not used on Pages.
          # Production OpenAI proxy lives on Vercel (/api/openai-search).

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
          commit_message: Deploy static site from main
